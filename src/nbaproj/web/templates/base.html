<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NBA Fantasy Projector{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafafa; --muted: #666; --accent: #1d4ed8; --card: #fff; --line: #d9d9d9; }
    @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --bg: #161616; --muted: #9a9a9a; --accent: #7aa2ff; --card: #1f1f1f; --line: #333; } }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.5rem; }
    h1 { font-size: 1.4rem; margin-top: 0; }
    label { display: block; margin: 1rem 0 .25rem; }
    input[type=password], input[type=text], input[type=search] { width: 100%; box-sizing: border-box; padding: .5rem; min-height: 44px; font: inherit; }
    button { margin-top: 1rem; padding: .5rem 1rem; min-height: 44px; font: inherit; cursor: pointer; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 .5rem; }
    ul.players, ul.changes, ul.matches { list-style: none; padding: 0; margin: 0; }
    li.player, li.match { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding: .25rem 0; border-bottom: 1px solid var(--line); }
    li.player button, li.match button { margin-top: 0; }
    li.change { padding: .25rem 0; }
    .message { min-height: 1.5rem; margin: 1rem 0 0; }
    .error { color: #b00020; }
    .muted { color: var(--muted); }
    .banner { margin: 0 0 1rem; padding: .5rem .75rem; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font-size: .9rem; }
    .banner-failed, .banner-stale { border-color: #b00020; }
    .banner p { margin: .25rem 0 0; }
    .banner form { margin: 0; }
    .banner button { margin-top: .5rem; }
  </style>
  {% if signed_in %}<script src="/static/htmx.min.js" defer></script>{% endif %}
</head>
<body{% if signed_in %} hx-headers='{{ {"X-CSRF-Token": csrf_token} | tojson }}'{% endif %}>
  <main>
    {% include "_freshness.html" %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

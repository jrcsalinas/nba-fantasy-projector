<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NBA Fantasy Projector{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafafa; --muted: #666; --accent: #1d4ed8; --card: #fff; --line: #d9d9d9; }
    @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --bg: #161616; --muted: #9a9a9a; --accent: #7aa2ff; --card: #1f1f1f; --line: #333; } }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.5rem; }
    h1 { font-size: 1.4rem; margin-top: 0; }
    label { display: block; margin: 1rem 0 .25rem; }
    input[type=password], input[type=text] { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; }
    button { margin-top: 1rem; padding: .5rem 1rem; font: inherit; cursor: pointer; }
    .error { color: #b00020; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

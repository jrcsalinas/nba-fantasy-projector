{% extends "base.html" %}
{% block title %}NBA Fantasy Projector{% endblock %}
{% block content %}
<div class="card">
  <h1>NBA Fantasy Projector</h1>
  <p>Signed in as {{ owner }}</p>
  <p><a href="/roster">My roster</a></p>

{% endblock %}

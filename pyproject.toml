[project]
name = "nba-fantasy-projector"
version = "0.1.0"
description = "Trend-based lineup advisor for NBA head-to-head 9-category fantasy leagues"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=nbaproj --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/nbaproj"]

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.design]
# Approved by Josh (2026-10-27): SQLAlchemy's TypeDecorator already has 7 ancestors.
max-parents = 10
# Approved by Josh (2026-10-28): PlayerLine mirrors the 16-column game_log table.
max-attributes = 16

[tool.pylint."messages control"]
# Approved by Josh (2026-10-27): ORM models are plain data classes, so this check misfires.
disable = ["too-few-public-methods"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
